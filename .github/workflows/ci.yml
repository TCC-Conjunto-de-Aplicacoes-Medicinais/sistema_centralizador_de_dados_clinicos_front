name: Frontend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/clinical-front

jobs:
  security-scan:
    name: Scan de Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed .env files
        run: |
          ENV_FILES=$(find . -name ".env" -o -name ".env.*" -not -name ".env.example" -type f)
          if [ ! -z "$ENV_FILES" ]; then
            echo "❌ ERROR: Sensitive .env files were found in the repository!"
            echo "$ENV_FILES"
            exit 1
          else
            echo "✅ No sensitive .env files found."
          fi

  build-and-test:
    name: Build & Test
    needs: security-scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Linting
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Next.js
        run: npm run build

  build-and-push:
    name: 🐳 Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "🔐 Login no Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "📦 Baixando imagem mais recente..."
            docker pull ${{ env.IMAGE_NAME }}:latest

            echo "🛑 Parando container antigo (se existir)..."
            docker stop clinical-front 2>/dev/null || true
            docker rm clinical-front 2>/dev/null || true

            echo "🚀 Iniciando novo container..."
            docker run -d \
              --name clinical-front \
              --restart always \
              --network host \
              -e PORT=8003 \
              --memory=256m \
              ${{ env.IMAGE_NAME }}:latest

            echo "🧹 Limpando imagens antigas..."
            docker image prune -af --filter "until=168h"

            echo "✅ Deploy concluído com sucesso!"
