name: Frontend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-scan:
    name: Scan de Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed .env files
        run: |
          ENV_FILES=$(find . -name ".env" -o -name ".env.*" -not -name ".env.example" -type f)
          if [ ! -z "$ENV_FILES" ]; then
            echo "❌ ERROR: Sensitive .env files were found in the repository!"
            echo "$ENV_FILES"
            exit 1
          else
            echo "✅ No sensitive .env files found."
          fi

      - name: Scan for API Keys, Tokens and Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test
    needs: security-scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Linting
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Next.js
        run: npm run build
